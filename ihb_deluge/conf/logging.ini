[loggers]
keys=root

[handlers]
keys=file_handler

[formatters]
keys=file_formatter

[logger_root]
level=INFO
handlers=file_handler

[handler_file_handler]
class=logging.handlers.RotatingFileHandler
level=INFO
formatter=file_formatter
args=('F:/dev/python/scripts/ihb_deluge/logs/app.log', 'a', 10485760, 5) # filename, mode, maxBytes, backupCount

[formatter_file_formatter]
format=%(asctime)s|%(levelname)-8s|%(module)s:%(lineno)d|%(message)s
datefmt=%Y.%m.%d %H:%M:%S