[loggers]
keys=root

[handlers]
keys=console_handler

[formatters]
keys=simple_formatter

[logger_root]
level=INFO
handlers=console_handler

[handler_console_handler]
class=StreamHandler
level=DEBUG
formatter=simple_formatter
args=(sys.stdout,)

[formatter_simple_formatter]
format=%(asctime)s|%(levelname)-8s|%(module)s:%(lineno)d|%(message)s